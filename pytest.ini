[pytest]
markers =
    e2e: real end-to-end tests against a live Flask server and a real local Ollama (src/tests/e2e/) - see specs/tests/test-plan.md's "Test layers" section. Excluded by default (addopts below); run explicitly with `pytest -m e2e` when a local Ollama is available.
addopts = -m "not e2e"
